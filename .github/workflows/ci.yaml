name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: feedback_ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: feedback_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U feedback_ci -d feedback_ci'
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL_TEST: postgres://feedback_ci:disposable-ci-only@localhost:5432/feedback_ci?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
      - run: npm install --global pnpm@12.5.1
      - run: pnpm --dir web install --frozen-lockfile
      - run: ./scripts/check.sh
      - run: pnpm --dir web exec playwright install --with-deps firefox
      - run: ./scripts/test-e2e.sh
      - run: docker compose config --quiet
      - run: docker build --tag feedback-hub:ci .
      - run: docker build --tag feedback-hub-caddy:ci --file deploy/Dockerfile.caddy .
      - run: docker run --rm --network none -v "$PWD/deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro" feedback-hub-caddy:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: docker run --rm --network none -v "$PWD/deploy/Caddyfile.production:/etc/caddy/Caddyfile:ro" feedback-hub-caddy:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: CADDY_TEST_IMAGE=feedback-hub-caddy:ci ./scripts/test-caddy-logs.sh
      - run: docker compose --env-file .env.example -f deploy/compose.production.yaml config --quiet
