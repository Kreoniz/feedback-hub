name: feedback-hub
x-logging: &logging
  driver: json-file
  options: { max-size: 5m, max-file: '3' }
services:
  db:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: feedback
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - database:/var/lib/postgresql
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro,z
      - ${SECRET_DIRECTORY:-./.local/secrets}/postgres_password:/run/secrets/postgres_password:ro,z
      - ${SECRET_DIRECTORY:-./.local/secrets}/db_password:/run/secrets/db_password:ro,z
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d feedback']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1
    pids_limit: 100
    security_opt: [no-new-privileges:true]
    logging: *logging
  app:
    image: ${FEEDBACK_IMAGE:-feedback-hub:local}
    build: .
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:18080}
      DEVELOPMENT: ${DEVELOPMENT:-true}
      DATABASE_URL_FILE: /run/secrets/database_url
      ADMIN_PASSWORD_HASH_FILE: /run/secrets/admin_hash
      APP_SECRET_FILE: /run/secrets/app_secret
      TRUSTED_PROXIES: 172.30.42.2/32
    volumes:
      - ${SECRET_DIRECTORY:-./.local/secrets}/database_url:/run/secrets/database_url:ro,z
      - ${SECRET_DIRECTORY:-./.local/secrets}/admin_hash:/run/secrets/admin_hash:ro,z
      - ${SECRET_DIRECTORY:-./.local/secrets}/app_secret:/run/secrets/app_secret:ro,z
    depends_on:
      db: { condition: service_healthy }
    networks: [data, ingress]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 1
    pids_limit: 64
    logging: *logging
  caddy:
    image: feedback-hub-caddy:local
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
    command: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
    ports: ['127.0.0.1:${FEEDBACK_PORT:-18080}:8080']
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro,z
    networks:
      ingress: { ipv4_address: 172.30.42.2 }
    depends_on: [app]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    cpus: 0.5
    pids_limit: 64
    logging: *logging
networks:
  data: { internal: true }
  ingress:
    ipam:
      config: [{ subnet: 172.30.42.0/28 }]
volumes:
  database:
