name: feedback-hub
x-logging: &logging
  driver: json-file
  options: { max-size: 5m, max-file: '3' }
services:
  db:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: feedback
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - database:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro,z
      - ${SECRET_DIRECTORY:?Set absolute SECRET_DIRECTORY}/postgres_password:/run/secrets/postgres_password:ro,z
      - ${SECRET_DIRECTORY}/db_password:/run/secrets/db_password:ro,z
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d feedback']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1
    pids_limit: 100
    security_opt: [no-new-privileges:true]
    logging: *logging
  app:
    image: ${FEEDBACK_IMAGE:?Set immutable FEEDBACK_IMAGE tag}
    environment:
      APP_ORIGIN: https://feedback.kreoniz.ru
      DEVELOPMENT: 'false'
      DATABASE_URL_FILE: /run/secrets/database_url
      ADMIN_PASSWORD_HASH_FILE: /run/secrets/admin_hash
      APP_SECRET_FILE: /run/secrets/app_secret
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?Set exact Caddy peer IP /32 or /128}
    volumes:
      - ${SECRET_DIRECTORY}/database_url:/run/secrets/database_url:ro,z
      - ${SECRET_DIRECTORY}/admin_hash:/run/secrets/admin_hash:ro,z
      - ${SECRET_DIRECTORY}/app_secret:/run/secrets/app_secret:ro,z
    depends_on:
      db: { condition: service_healthy }
    networks:
      data:
      edge:
        aliases: [feedback-hub-app]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 1
    pids_limit: 64
    logging: *logging
networks:
  data: { internal: true }
  edge:
    external: true
    name: ${EDGE_NETWORK:?Set actual shared Caddy network}
volumes:
  database:
